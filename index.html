<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpriză pentru Tine ♥</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #fde8ed;
            color: #5a3e43;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen { display: none; width: 100%; max-width: 600px; padding: 20px; text-align: center; }
        .screen.active { display: block; }

        /* SCENA 1: CODUL SECRET */
        .pin-container {
            background: #fff5f7;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .pin-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }
        .photo-frame {
            width: 80px;
            height: 80px;
            border: 4px solid #ffb6c1;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }
        .pin-title { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: #d86b81; }
        .pin-subtitle { font-size: 0.85rem; color: #e74c3c; margin-top: 5px; font-weight: 600; }
        
        .pin-dots { display: flex; justify-content: center; gap: 6px; margin: 20px 0; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #d86b81; }
        .dot.filled { background: #d86b81; }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 250px; margin: 0 auto; }
        .key {
            background: #fff; border: 1px solid #ffd1dc; padding: 12px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 600; color: #d86b81; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .key:active { transform: scale(0.95); }

        /* SCENA 2: CADOURILE */
        .gifts-grid { display: flex; justify-content: center; gap: 25px; margin-top: 40px; }
        .gift-box {
            background: #fff; 
            border-radius: 25px; 
            padding: 25px 20px; 
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(216, 107, 129, 0.15); 
            transition: all 0.3s ease;
        }
        .gift-box:hover { transform: translateY(-10px) scale(1.05); }
        .gift-icon { font-size: 4rem; }

        /* POPUP PLAYER MUSIC */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 25px; max-width: 450px; width: 90%;
            position: relative; animation: popIn 0.3s ease; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #aaa; }

        /* DESIGN PLAYER AUDIO */
        .vinyl { 
            width: 110px; height: 110px; background: #222; border-radius: 50%; margin: 15px auto; 
            border: 6px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            display: flex; align-items: center; justify-content: center;
        }
        .vinyl.spinning { animation: spin 4s linear infinite; }
        .vinyl-inner { width: 35px; height: 35px; background: #ff8da1; border-radius: 50%; border: 3px solid #fff; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-title { font-size: 1.1rem; font-weight: 600; color: #d86b81; margin-top: 10px; }
        .song-artist { font-size: 0.9rem; color: #888; margin-bottom: 15px; }

        /* BARA DE DERULARE (PROGRESS BAR) */
        .progress-container {
            width: 100%;
            margin: 15px 0 5px 0;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ffd1dc;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d86b81;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b06d7b;
            margin-top: 5px;
            font-weight: 600;
        }

        .player-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; margin-bottom: 12px; }
        .btn-control {
            background: #ffe4e8; border: none; color: #d86b81; border-radius: 50%;
            width: 50px; height: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-control.play-btn { width: 60px; height: 60px; background: #d86b81; color: #fff; font-size: 1.5rem; }
        .btn-control:active { transform: scale(0.9); }

        .hint-text { font-size: 0.85rem; color: #b06d7b; font-style: italic; margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- SCENA 1: INTRODUCERE COD SECRET -->
    <div id="screen-pin" class="screen active">
        <div class="pin-container">
            <div class="pin-header">
                <div class="photo-frame" style="background-image: url('https://via.placeholder.com/100');"></div>
                <div class="photo-frame" style="background-image: url('https://via.placeholder.com/100');"></div>
            </div>
            <h2 class="pin-title">Enter our secret code ♥</h2>
            <p class="pin-subtitle" id="pin-status">⚠️ Introdu codul secret pentru deblocare</p>
            
            <div class="pin-dots">
                <div class="dot" id="dot1"></div>
                <div class="dot" id="dot2"></div>
                <div class="dot" id="dot3"></div>
                <div class="dot" id="dot4"></div>
                <div class="dot" id="dot5"></div>
                <div class="dot" id="dot6"></div>
                <div class="dot" id="dot7"></div>
                <div class="dot" id="dot8"></div>
            </div>
            
            <div class="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key" onclick="clearPIN()">⌫</button>
                <button class="key" onclick="pressKey(0)">0</button>
            </div>
        </div>
    </div>

    <!-- SCENA 2: CADOURILE -->
    <div id="screen-gifts" class="screen">
        <h1 style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #d86b81;">You unlocked it!</h1>
        <p style="color: #888;">Alege un cadou ♥</p>
        
        <div class="gifts-grid">
            <div class="gift-box" onclick="openMusicModal()">
                <div class="gift-icon">🎁</div>
            </div>
            <div class="gift-box" onclick="openMusicModal()">
                <div class="gift-icon">🎁</div>
            </div>
            <div class="gift-box" onclick="openMusicModal()">
                <div class="gift-icon">🎁</div>
            </div>
        </div>
    </div>

    <!-- MODAL: PLAYER MUZICĂ -->
    <div id="modal-music" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMusicModal()">&times;</span>
            
            <div class="vinyl" id="vinyl-disk"><div class="vinyl-inner"></div></div>
            
            <div class="song-title">Dacă tu n-ai fi</div>
            <div class="song-artist">Leo de la Roșiori (Concert Evolution Live 2024)</div>

            <!-- BARA DE DERULARE -->
            <div class="progress-container">
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- CONTROALE PLAYER -->
            <div class="player-controls">
                <button class="btn-control" onclick="skipTime(-10)">-10s</button>
                <button class="btn-control play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="btn-control" onclick="skipTime(10)">+10s</button>
            </div>

            <p class="hint-text">Dă play de la minutul 1:00 🎵</p>

            <audio id="audio-player" src="melodie.mp3"></audio>
        </div>
    </div>

    <script>
        const SECRET_PIN = "13102025";
        let enteredPIN = "";
        let attemptCount = 0;

        function pressKey(num) {
            if (enteredPIN.length < 8) {
                enteredPIN += num;
                updateDots();
                if (enteredPIN.length === 8) {
                    setTimeout(checkPIN, 200);
                }
            }
        }

        function clearPIN() {
            enteredPIN = "";
            updateDots();
        }

        function updateDots() {
            for (let i = 1; i <= 8; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= enteredPIN.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function checkPIN() {
            attemptCount++;

            if (attemptCount === 1) {
                alert("❌ Cod incorect! Mai ai doar 2 încercări!");
                document.getElementById("pin-status").innerText = "⚠️ Mai ai 2 încercări!";
                clearPIN();
            } 
            else if (attemptCount === 2) {
                alert("❌ Cod incorect! Cadourile s-au blocat și nu le mai poți accesa! 🔒\n\nSistemul ți-a oferit totuși încă 2 încercări de salvare.");
                document.getElementById("pin-status").innerText = "⚠️ Cadouri blocate! Încercări de salvare: 2";
                clearPIN();
            }
            else if (attemptCount === 3) {
                alert("❌ Cod incorect! Mai ai 1 singură încercare de salvare!");
                document.getElementById("pin-status").innerText = "⚠️ Ultimul test! Bagă codul corect!";
                clearPIN();
            }
            else {
                if (enteredPIN === SECRET_PIN) {
                    document.getElementById('screen-pin').classList.remove('active');
                    document.getElementById('screen-gifts').classList.add('active');
                } else {
                    alert("❌ Cod greșit! Mai încearcă!");
                    clearPIN();
                }
            }
        }

        /* LOGICĂ PLAYER MUZICAL ȘI BARA DE DERULARE */
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const vinyl = document.getElementById('vinyl-disk');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        function openMusicModal() {
            document.getElementById('modal-music').classList.add('active');
        }

        function closeMusicModal() {
            document.getElementById('modal-music').classList.remove('active');
            audio.pause();
            playBtn.innerText = "▶";
            vinyl.classList.remove('spinning');
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
                vinyl.classList.add('spinning');
            } else {
                audio.pause();
                playBtn.innerText = "▶";
                vinyl.classList.remove('spinning');
            }
        }

        function skipTime(seconds) {
            audio.currentTime += seconds;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
                totalDurationEl.innerText = formatTime(audio.duration);
            }
        });

        function seekAudio(event) {
            const progressBar = event.currentTarget;
            const clickPosition = event.clientX - progressBar.getBoundingClientRect().left;
            const barWidth = progressBar.clientWidth;
            const seekTime = (clickPosition / barWidth) * audio.duration;
            audio.currentTime = seekTime;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
