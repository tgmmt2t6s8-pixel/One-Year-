<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="player-card">
        <div class="vinyl-container">
            <div class="vinyl" id="vinyl">
                <div class="vinyl-label"></div>
            </div>
        </div>

        <div class="song-details">
            <h2 class="title">Nume Melodie</h2>
            <p class="artist">Nume Artist</p>
        </div>

        <audio id="audio-player" src="melodie.mp3"></audio>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="time-container">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" id="prev"><i class="fas fa-backward"></i></button>
            <button class="btn play-btn" id="play"><i class="fas fa-play" id="play-icon"></i></button>
            <button class="btn" id="next"><i class="fas fa-forward"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
