<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surpriză pentru Tine ♥</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Great+Vibes&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Fredoka', sans-serif;
            background-color: #fde8ed;
            color: #5a3e43;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease, color 1s ease;
        }

        body.love-dark-mode {
            background-color: #1a080c;
            color: #ffd1dc;
        }

        .screen { 
            display: none; 
            width: 100%; 
            max-width: 600px; 
            padding: 20px; 
            text-align: center; 
            position: relative; 
            z-index: 10; 
            max-height: 90vh;
            overflow-y: auto;
        }
        .screen.active { display: block; }

        .music-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background: #d86b81;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 100;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .music-toggle-btn:active { transform: scale(0.9); }
        .music-toggle-btn.playing { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216, 107, 129, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(216, 107, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(216, 107, 129, 0); } }

        .rules-card {
            background: #fff5f7;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(216, 107, 129, 0.15);
            text-align: center;
        }
        .rules-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #d86b81;
            margin-bottom: 15px;
        }
        .rules-list {
            list-style: none;
            margin: 20px 0;
            text-align: left;
            display: inline-block;
        }
        .rules-list li {
            font-size: 1.05rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6a4a50;
            line-height: 1.3;
        }

        .pin-container {
            background: #fff5f7;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .pin-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }
        .photo-frame {
            width: 80px;
            height: 80px;
            border: 4px solid #ffb6c1;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }
        .pin-title { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: #d86b81; }
        .pin-subtitle { font-size: 0.85rem; color: #e74c3c; margin-top: 5px; font-weight: 600; min-height: 20px; }
        
        .pin-dots { display: flex; justify-content: center; gap: 6px; margin: 20px 0; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #d86b81; }
        .dot.filled { background: #d86b81; }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 250px; margin: 0 auto; }
        .key {
            background: #fff; border: 1px solid #ffd1dc; padding: 12px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 600; color: #d86b81; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            user-select: none;
        }
        .key:active { transform: scale(0.95); }
        .key.disabled { opacity: 0.5; pointer-events: none; }

        .gifts-grid { display: flex; justify-content: center; gap: 25px; margin-top: 40px; }
        .gift-box {
            background: #fff; 
            border-radius: 25px; 
            padding: 25px 20px; 
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(216, 107, 129, 0.15); 
            transition: all 0.3s ease;
        }
        .gift-box:hover { transform: translateY(-10px) scale(1.05); }
        .gift-icon { font-size: 4rem; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 25px; max-width: 450px; width: 90%;
            position: relative; animation: popIn 0.3s ease; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            color: #5a3e43;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #aaa; }

        .vinyl { 
            width: 110px; height: 110px; background: #222; border-radius: 50%; margin: 15px auto; 
            border: 6px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            display: flex; align-items: center; justify-content: center;
        }
        .vinyl.spinning { animation: spin 4s linear infinite; }
        .vinyl-inner { width: 35px; height: 35px; background: #ff8da1; border-radius: 50%; border: 3px solid #fff; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-title { font-size: 1.1rem; font-weight: 600; color: #d86b81; margin-top: 10px; }
        .song-artist { font-size: 0.9rem; color: #888; margin-bottom: 15px; }

        .progress-wrapper {
            width: 100%;
            padding: 12px 0;
            cursor: pointer;
            touch-action: none;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #ffd1dc;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d86b81;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b06d7b;
            margin-top: 5px;
            font-weight: 600;
        }

        .player-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; margin-bottom: 12px; }
        .btn-control {
            background: #ffe4e8; border: none; color: #d86b81; border-radius: 50%;
            width: 50px; height: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-control.play-btn { width: 60px; height: 60px; background: #d86b81; color: #fff; font-size: 1.5rem; }
        .btn-control:active { transform: scale(0.9); }

        .hint-text { font-size: 0.85rem; color: #b06d7b; font-style: italic; margin-top: 8px; font-weight: 600; }
        
        .btn-next-step {
            margin-top: 20px;
            background: #d86b81;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(216, 107, 129, 0.3);
            transition: transform 0.2s, background-color 0.3s;
        }
        .btn-next-step:active { transform: scale(0.95); }

        .envelope-container { position: relative; margin-top: 50px; }
        .click-hint {
            font-size: 1.1rem;
            color: #d86b81;
            font-weight: 600;
            margin-bottom: 25px;
            animation: bounce 1.5s infinite;
            transition: opacity 0.3s;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: #e28296;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .envelope-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #d47388; border-radius: 8px; z-index: 1;
        }

        .letter {
            position: absolute;
            bottom: 10px; left: 15px; width: 250px; height: 160px;
            background: #ffffff; border-radius: 8px; padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transform: translateY(0);
            transition: transform 0.8s ease 0.4s, z-index 0.1s linear 0.4s, height 0.4s ease 0.8s;
            z-index: 2; overflow: hidden; text-align: left;
        }

        .letter p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.15rem; line-height: 1.4; color: #4a3337;
        }

        .envelope-pocket {
            position: absolute; bottom: 0; left: 0; width: 0; height: 0;
            border-left: 140px solid #e07d92; border-right: 140px solid #e07d92;
            border-top: 95px solid transparent; border-bottom: 85px solid #d86f85;
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; z-index: 3;
        }

        .envelope-flap {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            border-left: 140px solid transparent; border-right: 140px solid transparent;
            border-top: 105px solid #c86379;
            transform-origin: top; transition: transform 0.5s ease; z-index: 4;
        }

        .envelope-wrapper.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .letter { transform: translateY(-160px); z-index: 5; height: 280px; overflow-y: auto; }

        .theme-card {
            background: #fff5f7;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(216, 107, 129, 0.15);
            transition: background 1s ease, border-color 1s ease;
        }

        body.love-dark-mode .theme-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 182, 193, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .theme-title { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #d86b81; margin-bottom: 15px; }
        body.love-dark-mode .theme-title { color: #ff8da1; }

        .theme-text { font-size: 1.1rem; line-height: 1.6; color: #5a3e43; }
        body.love-dark-mode .theme-text { color: #ffd1dc; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .gallery-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 8px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .gallery-card:active { transform: scale(0.98); }
        .gallery-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
        .gallery-caption {
            font-size: 0.85rem;
            margin-top: 6px;
            color: #ffd1dc;
            font-style: italic;
        }

        .floating-heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 1;
            animation: floatUp 4s linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="music-toggle-btn" id="floating-music-btn" onclick="toggleFloatingPlay()">🎵</div>

    <!-- ECRANUL 0: REGULI -->
    <div id="screen-rules" class="screen active">
        <div class="rules-card">
            <h1 class="rules-title">Reguli importante ♥</h1>
            <ul class="rules-list">
                <li>💡 <b>1.</b> Setează luminozitatea ecranului la maxim.</li>
                <li>🔊 <b>2.</b> Setează volumul telefonului la un sfert.</li>
                <li>😊 <b>3.</b> Zâmbește înainte să începi!</li>
                <li>✨ <b>4.</b> Fii foarte atentă la tot ce va urma...</li>
            </ul>
            <br>
            <button class="btn-next-step" onclick="goToPinScreen()">Am înțeles ➔</button>
        </div>
    </div>

    <!-- SCENA 1: CODUL SECRET -->
    <div id="screen-pin" class="screen">
        <div class="pin-container">
            <div class="pin-header">
                <div class="photo-frame" style="background-image: url('IMG_3844.jpeg');"></div>
                <div class="photo-frame" style="background-image: url('IMG_3853.jpeg');"></div>
            </div>
            <h2 class="pin-title">Enter our secret code ♥</h2>
            <p class="pin-subtitle" id="pin-status">⚠️ Introdu codul secret pentru deblocare</p>
            
            <div class="pin-dots">
                <div class="dot" id="dot1"></div>
                <div class="dot" id="dot2"></div>
                <div class="dot" id="dot3"></div>
                <div class="dot" id="dot4"></div>
                <div class="dot" id="dot5"></div>
                <div class="dot" id="dot6"></div>
                <div class="dot" id="dot7"></div>
                <div class="dot" id="dot8"></div>
            </div>
            
            <div class="keypad" id="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key" onclick="clearPIN()">⌫</button>
                <button class="key" onclick="pressKey(0)">0</button>
            </div>
        </div>
    </div>

    <!-- SCENA 2: CADOURILE -->
    <div id="screen-gifts" class="screen">
        <h1 style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #d86b81
